name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Next.js standalone
        run: npm run build

      - name: Write ECS deploy key
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "${{ secrets.ECS_SSH_KEY }}" > "$RUNNER_TEMP/ecs_deploy_key"
          chmod 600 "$RUNNER_TEMP/ecs_deploy_key"

      # 提前验证密钥与连通性，避免 rsync 半途才暴露连接失败
      - name: Verify SSH connectivity to ECS
        run: |
          ssh -i "$RUNNER_TEMP/ecs_deploy_key" \
              -o StrictHostKeyChecking=no \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              root@106.14.215.238 'systemctl is-active aimeng-elisa-web'

      - name: Deploy to ECS
        run: node scripts/deploy-aliyun.mjs
        env:
          SKIP_BUILD: 'true'
          ALIYUN_USER: root
          ALIYUN_HOST: 106.14.215.238
          ALIYUN_APP_ROOT: /opt/aimeng-elisa-web
          ALIYUN_SERVICE: aimeng-elisa-web
          ALIYUN_PUBLIC_URL: https://animaluni.com
          ALIYUN_KEY: ${{ runner.temp }}/ecs_deploy_key