<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">爱萌优宁网站使用方法与特点一图读懂</title>
  <desc id="desc">展示 AI 客服、实验方案设计、产品搜索、4PL 数据分析、酶标板计算器、知识社区和会员积分闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061224"/>
      <stop offset="0.52" stop-color="#081b35"/>
      <stop offset="1" stop-color="#07192b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36d7ff"/>
      <stop offset="1" stop-color="#1677ff"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#73f0bf"/>
      <stop offset="1" stop-color="#20b47c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .font { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 56px; font-weight: 800; fill: #f8fbff; }
      .subtitle { font-size: 24px; fill: #a9c4e4; }
      .card-title { font-size: 25px; font-weight: 800; fill: #f8fbff; }
      .card-text { font-size: 18px; fill: #c9d9ee; }
      .card-small { font-size: 16px; fill: #9fb5cf; }
      .tag { font-size: 16px; font-weight: 700; fill: #d8f2ff; }
      .center-title { font-size: 30px; font-weight: 900; fill: #ffffff; }
      .center-text { font-size: 19px; fill: #cfe4ff; }
      .footer { font-size: 24px; font-weight: 800; fill: #e8f7ff; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g opacity="0.22">
    <path d="M0 130H1600M0 270H1600M0 410H1600M0 550H1600M0 690H1600M0 830H1600" stroke="#68b6ff" stroke-width="1"/>
    <path d="M150 0V1000M330 0V1000M510 0V1000M690 0V1000M870 0V1000M1050 0V1000M1230 0V1000M1410 0V1000" stroke="#68b6ff" stroke-width="1"/>
  </g>
  <g opacity="0.18" filter="url(#softGlow)">
    <circle cx="770" cy="505" r="310" fill="#1b9cff"/>
    <circle cx="870" cy="525" r="230" fill="#22c58b"/>
  </g>

  <g class="font">
    <text x="800" y="82" text-anchor="middle" class="title">爱萌优宁科研服务网站，一图读懂</text>
    <text x="800" y="122" text-anchor="middle" class="subtitle">AI Agent + 产品搜索 + 实验数据分析 + 知识社区 + 会员积分兑换，全流程闭环</text>

    <g transform="translate(610 295)">
      <circle cx="190" cy="210" r="178" fill="#071a30" stroke="#37c7ff" stroke-width="3"/>
      <circle cx="190" cy="210" r="132" fill="#0d2743" stroke="#29d39a" stroke-width="2" opacity="0.95"/>
      <path d="M190 66C269 66 334 131 334 210S269 354 190 354 46 289 46 210 111 66 190 66Z" fill="none" stroke="#75e7ff" stroke-width="2" stroke-dasharray="12 14" opacity="0.8"/>
      <text x="190" y="182" text-anchor="middle" class="center-title">AI Agent</text>
      <text x="190" y="218" text-anchor="middle" class="center-text">让客户自己完成</text>
      <text x="190" y="248" text-anchor="middle" class="center-text">找产品 · 做方案 · 算数据 · 换积分</text>
      <text x="190" y="292" text-anchor="middle" class="tag">
        <tspan x="190" dy="0">少等待 · 少返工 · 一站式服务</tspan>
      </text>
    </g>

    <g transform="translate(88 190)">
      <rect width="390" height="170" rx="24" fill="#0b213a" stroke="#2ecbff" stroke-width="2"/>
      <circle cx="48" cy="48" r="26" fill="url(#blue)"/>
      <path d="M36 42h24a12 12 0 0 1 0 24H48l-14 12v-14a12 12 0 0 1 2-22Z" fill="#031421"/>
      <text x="92" y="45" class="card-title">AI 客服随时答疑</text>
      <text x="92" y="82" class="card-text">ELISA、细胞培养、产品使用问题</text>
      <text x="92" y="113" class="card-text">售前、售中、售后都能快速响应</text>
      <text x="92" y="145" class="card-small">客户少等待，销售和技术压力更小</text>
    </g>

    <g transform="translate(1122 190)">
      <rect width="390" height="170" rx="24" fill="#0b213a" stroke="#60e0aa" stroke-width="2"/>
      <circle cx="48" cy="48" r="26" fill="url(#green)"/>
      <path d="M34 61h28M36 44h24M39 31h18M37 31v30M59 31v30" stroke="#031421" stroke-width="5" stroke-linecap="round"/>
      <text x="92" y="45" class="card-title">实验方案 Agent</text>
      <text x="92" y="82" class="card-text">按实验目的和真实条件设计方案</text>
      <text x="92" y="113" class="card-text">支持 ELISA / 细胞 / WB / IHC / 生化</text>
      <text x="92" y="145" class="card-small">从“想做什么实验”开始，而不是先选产品</text>
    </g>

    <g transform="translate(88 410)">
      <rect width="390" height="170" rx="24" fill="#0b213a" stroke="#8bb9ff" stroke-width="2"/>
      <circle cx="48" cy="48" r="26" fill="#91b8ff"/>
      <circle cx="45" cy="44" r="12" fill="none" stroke="#031421" stroke-width="5"/>
      <path d="M55 55l15 15" stroke="#031421" stroke-width="6" stroke-linecap="round"/>
      <text x="92" y="45" class="card-title">产品智能模糊搜索</text>
      <text x="92" y="82" class="card-text">中英文、大小写、缩写、横线差异</text>
      <text x="92" y="113" class="card-text">种属、希腊字母、指标名称自动识别</text>
      <text x="92" y="145" class="card-small">客户更快找到对应 ELISA 指标</text>
    </g>

    <g transform="translate(1122 410)">
      <rect width="390" height="170" rx="24" fill="#0b213a" stroke="#ffd166" stroke-width="2"/>
      <circle cx="48" cy="48" r="26" fill="url(#gold)"/>
      <path d="M34 63c16-30 32-30 48 0M34 72h48M38 35h40" fill="none" stroke="#031421" stroke-width="5" stroke-linecap="round"/>
      <text x="92" y="45" class="card-title">ELISA 4PL 数据分析</text>
      <text x="92" y="82" class="card-text">下载模板，填 OD 值，上传计算</text>
      <text x="92" y="113" class="card-text">自动完成 4PL 拟合并生成报告</text>
      <text x="92" y="145" class="card-small">不用额外安装 ELISACalc，不用手工整理</text>
    </g>

    <g transform="translate(88 630)">
      <rect width="390" height="170" rx="24" fill="#0b213a" stroke="#4fd1c5" stroke-width="2"/>
      <circle cx="48" cy="48" r="26" fill="#4fd1c5"/>
      <rect x="32" y="31" width="32" height="42" rx="5" fill="none" stroke="#031421" stroke-width="5"/>
      <path d="M39 42h18M39 54h18M39 66h8" stroke="#031421" stroke-width="4" stroke-linecap="round"/>
      <text x="92" y="45" class="card-title">酶标板计算器</text>
      <text x="92" y="82" class="card-text">输入样本数量和分组方案</text>
      <text x="92" y="113" class="card-text">自动估算试剂盒规格和数量</text>
      <text x="92" y="145" class="card-small">减少反复询价和人工沟通</text>
    </g>

    <g transform="translate(1122 630)">
      <rect width="390" height="170" rx="24" fill="#0b213a" stroke="#c4a7ff" stroke-width="2"/>
      <circle cx="48" cy="48" r="26" fill="#b48cff"/>
      <path d="M35 36h26a9 9 0 0 1 0 18H44v20M67 73h-7a8 8 0 0 1 0-16h6" fill="none" stroke="#031421" stroke-width="5" stroke-linecap="round"/>
      <text x="92" y="45" class="card-title">知识社区与文献引用</text>
      <text x="92" y="82" class="card-text">每日知识按日历学习实验技巧</text>
      <text x="92" y="113" class="card-text">上传引用文献，按 IF 规则获得积分</text>
      <text x="92" y="145" class="card-small">知识沉淀和客户激励在网站内闭环</text>
    </g>

    <g transform="translate(520 785)">
      <rect width="560" height="130" rx="26" fill="#102844" stroke="#f6c65b" stroke-width="2"/>
      <circle cx="52" cy="54" r="27" fill="url(#gold)"/>
      <path d="M39 48h26v21H39zM45 48c-10-12 10-18 7 0M59 48c3-18 17-12 7 0" fill="none" stroke="#031421" stroke-width="5" stroke-linejoin="round"/>
      <text x="96" y="45" class="card-title">会员积分闭环</text>
      <text x="96" y="82" class="card-text">注册送 50 分 · 购买产品得积分 · 发表文献得积分 · 积分商城兑换商品</text>
      <text x="96" y="112" class="card-small">青铜 / 白银 / 黄金 / 铂金等级，兑换折扣随等级提升</text>
    </g>

    <path d="M503 274C570 229 614 225 664 258" fill="none" stroke="#3be3ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M1097 274C1030 229 986 225 936 258" fill="none" stroke="#60e0aa" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M502 496H598" fill="none" stroke="#8bb9ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M1098 496H1002" fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M502 712C578 752 625 755 675 724" fill="none" stroke="#4fd1c5" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M1098 712C1022 752 975 755 925 724" fill="none" stroke="#c4a7ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M800 720V775" fill="none" stroke="#f6c65b" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

    <text x="800" y="956" text-anchor="middle" class="footer">真实目的：让科研客户不用反复等人回复，也能完成咨询、选品、方案、计算、学习和积分兑换</text>
  </g>
</svg>
